# 构建 MSVC 2008 (VC9 / _MSC_VER 1500) 便携包 —— 独立工作流，不含 VS2010 任何内容
#
# 触发：手动 workflow_dispatch，或 push 到 vs2008/** 路径时自动
# 产物：msvc2008-portable-win.zip （Artifact，保留 30 天）
#
# 官方取件（微软下载中心）：
#   VS2008 SP1 中文 ISO : https://www.microsoft.com/zh-cn/download/details.aspx?id=13276
#                         FileName VS2008SP1CHSX1512981.iso  898.1 MB  <- 用户已实测
#
# 注意：VS2008 SP1 自带 Windows SDK v6.0A，直接用其头文件/库即可，
#       **不需要下载 SDK 7.1**（SDK 7.1 是 VS2010/VC10 的工具链，见 build-vs2010.yml）。

name: build-vs2008-portable

on:
  workflow_dispatch:
    inputs:
      vs2008_iso_url:
        description: 'VS2008 SP1 ISO 直链（默认微软官方 id=13276；直链轮换时留空触发页面解析）'
        default: 'https://download.microsoft.com/download/1/9/d/19d22169-a4b2-455f-8c28-ed137bd91487/VS2008SP1CHSX1512981.iso'
        type: string
      vs2008_iso_sha1:
        description: 'VS2008 ISO 的 SHA1（留空则只记录不校验）'
        default: ''
        type: string
      arch:
        description: '目标架构'
        default: 'x86'
        type: choice
        options: [x86, x64]
  push:
    branches: ['**']
    paths: ['vs2008/**', 'scripts/**', '.github/workflows/build-vs2008.yml']

# 同一分支只跑最新一次，避免 ISO 重复占磁盘
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # windows-2022 自带 .NET 4.x + 7-Zip，满足 VS2008 静默安装前置
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VS2008_ISO: ${{ github.workspace }}\_dl\VS2008SP1.iso
      OUT_DIR: ${{ github.workspace }}\msvc2008-portable

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 ISO（_dl 目录，命中则跳过下载）
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\_dl
          key: msvc2008-dl-v1

      - name: 预检环境（.NET4 / 7-Zip / 磁盘 / 管理员）
        shell: pwsh
        run: scripts/00-preflight.ps1

      - name: 下载 VS2008 SP1 ISO（官方预设 + 重试/续传）
        shell: pwsh
        # -Preset 内置官方直链；直链轮换 404 时脚本会自动回退到下载页解析。
        # 仅当手动传入非空 Url 时覆盖；彻底避免 "-Url ''" 空串报错。
        run: >-
          scripts/01-fetch-iso.ps1
          -Preset vs2008
          -Url "${{ inputs.vs2008_iso_url || '' }}"
          -OutFile "$env:VS2008_ISO"
          -Sha1 "${{ inputs.vs2008_iso_sha1 || '' }}"

      - name: 静默安装 VS2008 (VC++9，含自带 SDK v6.0A)
        shell: pwsh
        run: scripts/02-install-vs2008.ps1 -IsoPath "$env:VS2008_ISO"

      - name: 收集 VC9 + 自带 SDK v6.0A 目录并生成绿色包
        shell: pwsh
        run: scripts/04-collect.ps1 -Toolset 2008 -Arch "${{ inputs.arch }}" -OutDir "$env:OUT_DIR"

      - name: 自检 —— 用绿色包编译并运行 hello.cpp（期望 _MSC_VER 1500）
        shell: pwsh
        run: scripts/05-selftest.ps1 -Root "$env:OUT_DIR" -Arch "${{ inputs.arch }}" -ExpectMscVer 1500

      - name: 打包
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:OUT_DIR\*" -DestinationPath "$env:GITHUB_WORKSPACE\msvc2008-portable-win.zip" -Force
          Get-Item "$env:GITHUB_WORKSPACE\msvc2008-portable-win.zip" | Select-Object Name,Length

      - name: 上传 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc2008-portable-win
          path: msvc2008-portable-win.zip
          retention-days: 30
          if-no-files-found: warn

      - name: 上传安装日志（仅在失败时，便于排错）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vs2008-install-logs
          path: |
            ${{ env.RUNNER_TEMP }}\*.log
          retention-days: 7
          if-no-files-found: ignore
